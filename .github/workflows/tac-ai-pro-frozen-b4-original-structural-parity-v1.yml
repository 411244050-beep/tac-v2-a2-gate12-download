name: TAC B4 original structural and recovery exact scientific source parity
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/build_frozen_b4_append_v1.py'
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/test_frozen_b4_inline_parity_v1.py'
      - '.github/workflows/tac-ai-pro-frozen-b4-original-structural-parity-v1.yml'
permissions:
  contents: write
jobs:
  frozen_original_B4_science:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TAC_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build AST-equivalent original B4 single-module append
        run: |
          set -euo pipefail
          test "$TAC_LIVE_ENABLED" = "0"
          python downloads/ai-pro-native-core-20261105/native_candidate_v1/build_frozen_b4_append_v1.py
      - name: Differential tests original B4 vs inline including TRUE FALSE UNKNOWN CONFLICT
        run: |
          cd downloads/ai-pro-native-core-20261105/native_candidate_v1
          python -m unittest -v test_frozen_b4_inline_parity_v1.py
      - name: Publish exact source artifact and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ai-pro-native-core-20261105/native_candidate_v1/B4_FROZEN_ORIGINAL_PRODUCER_APPEND_V1.py
          git add downloads/ai-pro-native-core-20261105/native_candidate_v1/B4_FROZEN_ORIGINAL_PRODUCER_APPEND_V1.manifest.json
          if git diff --cached --quiet; then
            echo ORIGINAL_FROZEN_B4_ALREADY_PUBLISHED
          else
            git commit -m "build(ai-pro-native): publish AST-preserved original frozen B4 structural and recovery evidence"
            git push origin HEAD:main
          fi
