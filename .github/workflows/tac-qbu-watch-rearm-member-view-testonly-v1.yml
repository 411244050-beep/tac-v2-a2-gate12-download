name: TAC QBU WATCH-REARM original membership view TEST_ONLY
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/QBU_WATCH_REARM_MEMBER_VIEW_TEST_ONLY_V1.py'
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/test_qbu_watch_rearm_member_view_test_only_v1.py'
      - '.github/workflows/tac-qbu-watch-rearm-member-view-testonly-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded_watch_rearm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TAC_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run original-source guarded WATCH-REARM view tests
        shell: bash
        run: |
          set -euo pipefail
          test "$TAC_LIVE_ENABLED" = "0"
          cd downloads/ai-pro-native-core-20261105/native_candidate_v1
          python -m unittest -v test_qbu_watch_rearm_member_view_test_only_v1.py
