name: TAC frozen B3-D3 rearm gap source-only reproduction
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/test_b3_d3_rearm_gap_source_only_v1.py'
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/test_b3_d3_rearm_short_atomic_contract_v1.py'
      - '.github/workflows/tac-b3-d3-rearm-gap-source-only-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen_b3_rearm_gap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TAC_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run source-only rearm proof (not Binance platform acceptance)
        shell: bash
        run: |
          set -euo pipefail
          test "$TAC_LIVE_ENABLED" = "0"
          cd downloads/ai-pro-native-core-20261105/native_candidate_v1
          python -m unittest -v test_b3_d3_rearm_gap_source_only_v1.py test_b3_d3_rearm_short_atomic_contract_v1.py
