name: TAC frozen Runtime B3 into original D3 007 008 exact source
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/RUNTIME_B3_FROZEN_ORIGINAL_PRODUCER_APPEND_V1.py'
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/RUNTIME_B3_TO_ORIGINAL_D3_UPDATE007_BRIDGE_V1.py'
      - '.github/workflows/tac-ai-pro-frozen-b3-to-original-d3-causal-v1.yml'
permissions:
  contents: read
jobs:
  original_f3_price_return_d3_episode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TAC_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile original source plus frozen B3 and stage adapter, exercise real D3 transition
        shell: bash
        run: |
          set -euo pipefail
          test "$TAC_LIVE_ENABLED" = "0"
          python - <<'PY'
          import ast,sys,types,hashlib
          from pathlib import Path
          from fractions import Fraction
          from types import SimpleNamespace
          root=Path('downloads/ai-pro-native-core-20261105/native_candidate_v1')
          source=(root/'strategy/strategy.py').read_text()
          b3=(root/'RUNTIME_B3_FROZEN_ORIGINAL_PRODUCER_APPEND_V1.py').read_text()
          bridge=(root/'RUNTIME_B3_TO_ORIGINAL_D3_UPDATE007_BRIDGE_V1.py').read_text()
          assert hashlib.sha256(ast.dump(ast.parse(b3),include_attributes=False).encode()).hexdigest()=='d8dec00ab2d5d9c5723dd041b21ad95a1d83dcb244ee83a1558bd631607399cc'
          complete=source+'\n'+b3+'\n'+bridge
          a=ast.parse(source)
          b=ast.parse(complete)
          assert [ast.dump(n,include_attributes=False) for n in a.body]==[ast.dump(n,include_attributes=False) for n in b.body[:len(a.body)]]
          compile(complete,'original_tac_with_frozen_return.py','exec')
          for name in ('binance','binance.strategy','binance.strategy.runtime',
                       'binance.strategy.node','binance.strategy.node.capabilities',
                       'binance.strategy.node.capabilities.data'):
              sys.modules[name]=types.ModuleType(name)
          r=sys.modules['binance.strategy.runtime']
          r.node=lambda name:lambda fn:fn
          r.workflow=lambda fn:fn
          r.ctx=types.SimpleNamespace(state={},exception=lambda *a,**k:None)
          sys.modules['binance.strategy.node.capabilities.data'].kline_stream=lambda **k:None
          c=types.ModuleType('tac_frozen_f3_d3_source')
          sys.modules[c.__name__]=c
          exec(compile(complete,'original_tac_with_frozen_return.py','exec'),vars(c))
          assert c.TAC_LIVE_ENABLED==0
          t0=1800000000000
          params=c.frozen_d3_parameters(c.current_partial_parameter_snapshot())
          d3=c.D3ReferenceSkeleton.from_parameter_snapshot(c.current_partial_parameter_snapshot())
          cand=c.build_candidate(symbol='BTCUSDT',source_timeframe_ms=900000,
             target_trend_episode_id='EP_ACTUAL_ORIGINAL_B3',
             target_direction=c.TrendDirection.LONG,
             family=c.CandidateFamily.EMA20,
             line=c.InfoValue.known(Fraction(100)),
             source_scale=c.InfoValue.known(Fraction(2)),
             source_segment_id='SEG_PROVENANCE',available_at=t0-1,
             source_continuity_ok=True)
          snap=d3.update_008_register_candidate(cand)
          assert snap is not None
          b3state=c.RuntimeB3PriceDrivenReturnProducerV1()
          trace=[]
          for i,(op,hi,lo,cl) in enumerate(
              (('110','112','108','110'),('105','106','99','101'),
               ('102','105','98','103'),('103','108','101','106'))):
              now=t0+i*900000
              bar=c.CanonicalBar.from_values(
                  symbol='BTCUSDT',open_time=now,close_time=now+899999,
                  open=op,high=hi,low=lo,close=cl)
              old=d3.update_000_pre_bar_view(bar.open_time)
              assert len(old.snapshots)==1
              geom=d3.update_002_capture_geometry(
                  bar=bar,information_cutoff=bar.close_time,snapshot=old.snapshots[0])
              result=c._tac_frozen_b3_update007_step(
                  producer=b3state,d3=d3,candidate=cand,snapshot=snap,
                  geometry=geom,bar=bar,
                  current_trend=SimpleNamespace(
                     episode_id='EP_ACTUAL_ORIGINAL_B3',
                     direction=c.TrendDirection.LONG),
                  source_continuity_intact=True,
                  candidate_terminally_replaced=False,history_complete=True)
              ev=result['event']
              prod=result['producer']
              trace.append((prod.reason,ev.control.value,
                            result['episode'] is not None,
                            prod.return_evidence is not None))
              assert not result['entry_ready'] and not result['orders']
          assert trace[0]==('ARMED_FROZEN_CURRENT_CUTOFF_NO_RETURN','ARMED',False,False),trace
          assert trace[1][0]=='RETURN_QUALIFIED_LATCHED_NOT_CONSUMABLE_SAME_CUTOFF',trace
          assert trace[1][3] is False
          assert trace[2][0]=='LATCHED_RETURN_CONSUMABLE',trace
          assert trace[2][1]=='INTERACTION_ACTIVE' and trace[2][2] and trace[2][3],trace
          assert trace[3][1]=='RESOLVED' and trace[3][2],trace
          assert d3.current_episode(cand.candidate_id) is not None
          assert len(b3state.state.lineages)==0
          with_state=c.RuntimeB3PriceDrivenReturnProducerV1()
          try:c._tac_frozen_b3_update007_step(
             producer=with_state,d3=d3,candidate=cand,snapshot=snap,
             geometry=geom,bar=bar,
             current_trend=SimpleNamespace(episode_id='EP_ACTUAL_ORIGINAL_B3',
                                           direction=c.TrendDirection.LONG),
             source_continuity_intact=True,candidate_terminally_replaced=False,
             history_complete=False)
          except ValueError as e:assert 'INCOMPLETE_REPLAY' in str(e)
          else:raise AssertionError('Incomplete history should fail closed')
          print('FROZEN_RUNTIME_B3_TO_ORIGINAL_D3_CAUSAL_PASS',trace,
                'no synthetic return, no D4 confirmation, no trading')
          PY
