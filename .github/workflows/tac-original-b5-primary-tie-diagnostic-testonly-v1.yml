name: TAC frozen B5 Primary same-cutoff tie TEST_ONLY
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/test_original_b5_primary_same_cutoff_ambiguity_v1.py'
      - '.github/workflows/tac-original-b5-primary-tie-diagnostic-testonly-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_role_tie:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TAC_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Original QBU B5 role arbitration TEST_ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "$TAC_LIVE_ENABLED" = "0"
          cd downloads/ai-pro-native-core-20261105/native_candidate_v1
          python -m unittest -v test_original_b5_primary_same_cutoff_ambiguity_v1.py
