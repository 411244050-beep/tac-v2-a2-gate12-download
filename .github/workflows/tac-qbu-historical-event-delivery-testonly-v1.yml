name: TAC original QBU historical event delivery TEST_ONLY
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ai-pro-native-core-20261105/native_candidate_v1/test_qbu_identity_historical_event_delivery_v1.py'
      - '.github/workflows/tac-qbu-historical-event-delivery-testonly-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen_identity_history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TAC_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run original identity history parity (no network or trading)
        shell: bash
        run: |
          set -euo pipefail
          test "$TAC_LIVE_ENABLED" = "0"
          cd downloads/ai-pro-native-core-20261105/native_candidate_v1
          python -m unittest -v test_qbu_identity_historical_event_delivery_v1.py
